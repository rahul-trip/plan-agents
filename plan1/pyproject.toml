[project]
name = "planagents"
version = "0.1.0"
description = "Hands-on curriculum for plan-based multi-agent systems"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "langchain>=1.4,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-ollama>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8,<3",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planagents"]

[tool.pytest.ini_options]
# Live tests call real APIs, so they only run when asked for. A later -m live overrides this one.
addopts = "--import-mode=importlib -ra -m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["stages"]
markers = [
    "postgres: needs the docker compose Postgres (docker compose up -d --wait)",
    "live: calls a real LLM or public API; run explicitly with -m live",
]
